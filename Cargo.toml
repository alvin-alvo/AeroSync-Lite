[package]
name        = "aerosync-lite"
version     = "0.1.0"
edition     = "2021"
description = "Hyper-lightweight Windows 11 taskbar lyric widget"
repository  = "https://github.com/alvin-alvo/AeroSync-Lite"
license     = "GPL-3.0"

[[bin]]
name = "aerosync-lite"
path = "src/main.rs"

# ── Release profile: maximise shrink ──────────────────────────────────────────
[profile.release]
opt-level     = "z"      # size-optimise (also helps i-cache on a tiny binary)
lto           = "fat"    # whole-program link-time optimisation
codegen-units = 1
panic         = "abort"  # removes unwinding machinery (~30 KB)
strip         = "symbols"

# ── Dependencies ──────────────────────────────────────────────────────────────
[dependencies]
windows = { version = "0.58", features = [
    # WinRT / COM init
    "implement",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_WinRT",

    # Win32 foundation
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",    # GetSystemTimePreciseAsFileTime
    "Win32_System_Threading",
    "Win32_System_Registry",

    # Win32 UI
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",

    # Win32 Graphics
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",            # WIC

    # Win32 Networking
    "Win32_Networking_WinHttp",

    # WinRT namespaces
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
] }
